[greeter]
# Match the dark, opaque palette used by Polybar.
theme-name = Dracula
icon-theme-name = Dracula
font-name = Sans 11
background = #1a202b
user-background = false

# Keep the login card centered and show useful controls in a compact top panel.
position = 50% 50%
panel-position = top
clock-format = %a, %d %b  %H:%M
indicators = ~clock;~language;~layout;~session;~power

# GTK rendering and text quality.
xft-antialias = true
xft-hintstyle = slight
xft-rgba = rgb
transition-type = none
transition-duration = 0
hide-user-image = true
round-user-image = false
