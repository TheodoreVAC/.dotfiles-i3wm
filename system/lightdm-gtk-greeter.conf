[greeter]
# Match the dark, opaque palette used by Polybar, Alacritty, and Yazi.
theme-name = Dracula
icon-theme-name = Dracula
font-name = DejaVu Sans Mono 11
background = #111720
user-background = false

# Keep the login card centered and remove the top indicator panel.
position = 50% 50%
indicators =

# GTK rendering and text quality.
xft-antialias = true
xft-hintstyle = slight
xft-rgba = rgb
transition-type = none
transition-duration = 0
hide-user-image = true
round-user-image = false
