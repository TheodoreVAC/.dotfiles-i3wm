[app]
overall = { bg = "#120C0E" }

[mgr]
cwd = { fg = "#E63946", bold = true }
find_keyword = { fg = "#E9843F", bg = "#3A2A2E", bold = true }
find_position = { fg = "#8C7376", italic = true }
symlink_target = { fg = "#8C7376" }
marker_copied = { fg = "#E0A458", bg = "#120C0E" }
marker_cut = { fg = "#FF5A63", bg = "#120C0E" }
marker_marked = { fg = "#E9843F", bg = "#120C0E" }
marker_selected = { fg = "#E63946", bg = "#120C0E" }
count_copied = { fg = "#120C0E", bg = "#E0A458", bold = true }
count_cut = { fg = "#120C0E", bg = "#FF5A63", bold = true }
count_selected = { fg = "#120C0E", bg = "#E63946", bold = true }
border_style = { fg = "#3A2A2E" }

[indicator]
parent = { fg = "#8C7376", bg = "#120C0E" }
current = { fg = "#E63946", bg = "#120C0E" }
preview = { fg = "#C2555F", bg = "#120C0E" }

[tabs]
active = { fg = "#120C0E", bg = "#E63946", bold = true }
inactive = { fg = "#EADCDE", bg = "#241A1D" }

[mode]
normal_main = { fg = "#120C0E", bg = "#E63946", bold = true }
normal_alt = { fg = "#EADCDE", bg = "#241A1D" }
select_main = { fg = "#120C0E", bg = "#E0A458", bold = true }
select_alt = { fg = "#EADCDE", bg = "#241A1D" }
unset_main = { fg = "#120C0E", bg = "#FF5A63", bold = true }
unset_alt = { fg = "#EADCDE", bg = "#241A1D" }

[status]
overall = { fg = "#EADCDE", bg = "#1A1215" }
perm_type = { fg = "#E63946" }
perm_read = { fg = "#E0A458" }
perm_write = { fg = "#E9843F" }
perm_exec = { fg = "#FF5A63" }
perm_sep = { fg = "#8C7376" }
progress_normal = { fg = "#E63946", bg = "#241A1D" }
progress_error = { fg = "#FF5A63", bg = "#241A1D" }

[which]
cols = 3
mask = { bg = "#120C0E" }
cand = { fg = "#E63946", bold = true }
rest = { fg = "#8C7376" }
desc = { fg = "#EADCDE" }
separator = "  →  "
separator_style = { fg = "#8C7376" }

[confirm]
border = { fg = "#3A2A2E" }
title = { fg = "#E63946", bold = true }
body = { fg = "#EADCDE" }
list = { fg = "#EADCDE" }
btn_yes = { fg = "#120C0E", bg = "#E0A458", bold = true }
btn_no = { fg = "#120C0E", bg = "#FF5A63", bold = true }
btn_labels = ["Yes", "No"]

[spot]
border = { fg = "#3A2A2E" }
title = { fg = "#E63946", bold = true }
tbl_col = { fg = "#E63946", bold = true }
tbl_cell = { fg = "#EADCDE" }

[notify]
title_info = { fg = "#E63946", bold = true }
title_warn = { fg = "#E9843F", bold = true }
title_error = { fg = "#FF5A63", bold = true }

[pick]
border = { fg = "#3A2A2E" }
active = { fg = "#120C0E", bg = "#E63946", bold = true }
inactive = { fg = "#EADCDE", bg = "#241A1D" }

[input]
border = { fg = "#3A2A2E" }
title = { fg = "#E63946", bold = true }
value = { fg = "#EADCDE" }
selected = { fg = "#120C0E", bg = "#E63946" }

[cmp]
border = { fg = "#3A2A2E" }
active = { fg = "#120C0E", bg = "#E63946", bold = true }
inactive = { fg = "#EADCDE", bg = "#241A1D" }

[tasks]
border = { fg = "#3A2A2E" }
title = { fg = "#E63946", bold = true }
hovered = { fg = "#120C0E", bg = "#E63946" }

[help]
border = { fg = "#3A2A2E" }
chord = { fg = "#E63946", bold = true }
action = { fg = "#EADCDE" }
hovered = { fg = "#120C0E", bg = "#E63946" }

[filetype]
rules = [
    { url = "*/", fg = "#E63946", bold = true },
    { url = "*", is = "exec", fg = "#E0A458", bold = true },
    { url = "*", is = "orphan", fg = "#FF5A63", bold = true },
    { url = "*", is = "link", fg = "#8C7376" },
    { mime = "image/*", fg = "#C2555F" },
    { mime = "{audio,video}/*", fg = "#FAB387" },
]

[icon]
dirs = [
    { name = ".config", text = "", fg = "#E63946" },
    { name = ".git", text = "", fg = "#E63946" },
    { name = ".github", text = "", fg = "#E63946" },
    { name = ".npm", text = "", fg = "#E63946" },
    { name = "Desktop", text = "", fg = "#E63946" },
    { name = "Development", text = "", fg = "#E63946" },
    { name = "Documents", text = "", fg = "#E63946" },
    { name = "Downloads", text = "", fg = "#E63946" },
    { name = "Library", text = "", fg = "#E63946" },
    { name = "Movies", text = "", fg = "#E63946" },
    { name = "Music", text = "", fg = "#E63946" },
    { name = "Pictures", text = "", fg = "#E63946" },
    { name = "Public", text = "", fg = "#E63946" },
    { name = "Videos", text = "", fg = "#E63946" },
]
prepend_conds = [
    { if = "dir & hovered", text = "", fg = "#FF5A63" },
    { if = "dir", text = "", fg = "#E63946" },
]
