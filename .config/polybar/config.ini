;==========================================================
;                 POLYBAR — GLASS BLUE
;==========================================================

[colors]

background          = #B01a1d24
background-alt      = #C020242c

foreground          = #e8edf4
foreground-white    = #ffffff
foreground-dim      = #8a94a3

primary             = #7fb8e0
secondary           = #9ecdea
accent              = #8cc4e8

volume-color        = #9ecdea
network-color       = #9ac8e6
date-color          = #aed5ef
redshift-color      = #9ecdea
memory-color        = #9ecdea
disk-color          = #8fbfe2

alert               = #ff6b82
disabled            = #5a6472


;==========================================================
; SETTINGS
;==========================================================

[settings]

screenchange-reload = true
pseudo-transparency = true


;==========================================================
; BAR
;==========================================================

[bar/example]

width = 100%
height = 22pt

radius = 0
bottom = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 0
padding-right = 2

border-size = 0
border-color = ${colors.background}

module-margin-left = 0
module-margin-right = 0

separator =
separator-foreground = ${colors.disabled}

line-size = 2pt
line-color = ${colors.primary}

font-0 = "AdwaitaMono Nerd Font:style=Bold:size=11;3"
font-1 = "AdwaitaMono Nerd Font:size=14;2"
font-2 = "Symbols Nerd Font Mono:size=13;2"

modules-left = xworkspaces tray xwindow
modules-center =
modules-right = pulseaudio wlan redshift memory filesystem date

cursor-click = pointer
cursor-scroll = pointer

enable-ipc = true
wm-restack = i3


;==========================================================
; WORKSPACES
;==========================================================

[module/xworkspaces]

type = internal/xworkspaces

format = <label-state>

index-sort = true
wrapping-scroll = false

label-active = %name%
label-active-background = ${colors.background}
label-active-foreground = ${colors.foreground-white}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-background = ${colors.background}
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-visible = %name%
label-visible-background = ${colors.background}
label-visible-foreground = ${colors.foreground}
label-visible-underline = ${colors.secondary}
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.background}
label-urgent-foreground = ${colors.alert}
label-urgent-underline = ${colors.alert}
label-urgent-padding = 1


;==========================================================
; SYSTEM TRAY
;==========================================================

[module/tray]

type = internal/tray

format = <tray>

tray-spacing = 4px
tray-size = 70%

tray-background = ${colors.background}
tray-foreground = ${colors.foreground}


;==========================================================
; WINDOW TITLE
;==========================================================

[module/xwindow]

type = internal/xwindow

format = <label>

format-background = ${colors.background}
format-padding = 1

format-prefix-foreground = ${colors.primary}
format-prefix-font = 3

label = %title%
label-foreground = ${colors.foreground-white}
label-maxlen = 60

label-empty = Desktop
label-empty-foreground = ${colors.foreground-dim}


;==========================================================
; VOLUME
;==========================================================

[module/pulseaudio]

type = internal/pulseaudio

format-volume = <ramp-volume><label-volume>
format-volume-background = ${colors.background}
format-volume-padding = 1
format-volume-spacing = 0

ramp-volume-0 = 󰖀
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

ramp-volume-foreground = ${colors.volume-color}
ramp-volume-font = 3

label-volume = %percentage%%
label-volume-foreground = ${colors.foreground-white}

format-muted = <label-muted>
format-muted-background = ${colors.background}
format-muted-padding = 1

label-muted = 󰖁 muted
label-muted-foreground = ${colors.foreground-dim}
label-muted-font = 3

click-left = #pulseaudio.toggle
click-right = pavucontrol &
scroll-up = #pulseaudio.inc
scroll-down = #pulseaudio.dec


;==========================================================
; WIFI
;==========================================================

[module/wlan]

type = internal/network

interface = wlp10s0
interface-type = wireless
interval = 1

format-connected = <label-connected>
format-connected-background = ${colors.background}
format-connected-padding = 1

format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.network-color}
format-connected-prefix-font = 3

label-connected = %downspeed%
label-connected-foreground = ${colors.foreground-white}

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.background}
format-disconnected-padding = 1

format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.foreground-dim}
format-disconnected-prefix-font = 3

label-disconnected = disconnected
label-disconnected-foreground = ${colors.foreground-dim}

click-left = nm-connection-editor



;==========================================================
; REDSHIFT
;==========================================================

[module/redshift]

type = custom/text

content = "󰖔"
content-foreground = ${colors.redshift-color}
content-font = 3
content-padding = 1

click-left = redshift -O 4000
click-right = redshift -x
click-middle = redshift -O 3500


;==========================================================
; MEMORY
;==========================================================

[module/memory]

type = internal/memory

interval = 3

format = <label>
format-background = ${colors.background}
format-padding = 1

format-prefix = " "
format-prefix-foreground = ${colors.memory-color}
format-prefix-font = 3

label = %percentage_used%%
label-foreground = ${colors.foreground-white}


;==========================================================
; FILESYSTEM
;==========================================================

[module/filesystem]

type = internal/fs

mount-0 = /
interval = 10

fixed-values = true

format-mounted = <label-mounted>
format-mounted-background = ${colors.background}
format-mounted-padding = 1

format-mounted-prefix = " "
format-mounted-prefix-foreground = ${colors.disk-color}
format-mounted-prefix-font = 3

label-mounted = %percentage_used%%
label-mounted-foreground = ${colors.foreground-white}

format-unmounted = <label-unmounted>
format-unmounted-background = ${colors.background}

label-unmounted = %mountpoint%: not mounted
label-unmounted-foreground = ${colors.foreground-dim}


;==========================================================
; DATE
;==========================================================

[module/date]

type = internal/date

interval = 1

date = %a %b %d
time = %H:%M:%S

format = <label>
format-background = ${colors.background}
format-padding = 1

format-prefix = "󰸘 "
format-prefix-foreground = ${colors.date-color}
format-prefix-font = 3

label = %date% %time%
label-foreground = ${colors.foreground-white}


;==========================================================
; END
;==========================================================