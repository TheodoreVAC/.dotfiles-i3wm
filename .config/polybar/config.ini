;==========================================================
;              POLYBAR — DARK FLOATING STYLE
;==========================================================

[colors]

background     = #1a202b
background-alt = #161B24

foreground          = #D8DEE9
foreground-white    = #FFFFFF
foreground-dim      = #6F7785

pink                = #F5C2E7
blue                = #89B4FA
green               = #A6E3A1
yellow              = #F9E2AF
purple              = #CBA6F7
orange              = #FAB387
red                 = #F38BA8
date-background     = #454A54

workspace-active    = #FFFFFF
workspace-underline = #89B4FA

alert               = #BF616A
disabled            = #4C566A


;==========================================================
; SETTINGS
;==========================================================

[settings]

screenchange-reload = true
pseudo-transparency = false


;==========================================================
; BAR
;==========================================================

[bar/example]

;==========================================================
; MONITOR
;==========================================================

monitor = HDMI-A-0
monitor-strict = true

;==========================================================
; POSITION
;==========================================================

width = 97%
height = 32

offset-x = 1.5%
offset-y = 4

bottom = false
fixed-center = true

;==========================================================
; WINDOW MANAGEMENT
;==========================================================

override-redirect = true
wm-restack = i3
enable-struts = true

;==========================================================
; APPEARANCE
;==========================================================

radius = 5

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 0
padding-right = 0

border-size = 0
border-color = ${colors.background}

module-margin-left = 0
module-margin-right = 0

separator =

line-size = 3pt


;==========================================================
; FONTS
;==========================================================

font-0 = "AdwaitaMono Nerd Font:style=Bold:size=12;3"
font-1 = "AdwaitaMono Nerd Font:size=15;2"
font-2 = "Symbols Nerd Font Mono:size=16;2"
font-3 = "Symbols Nerd Font Mono:size=12;2"


;==========================================================
; MODULES
;==========================================================

modules-left = arch xworkspaces tray xwindow
modules-center =
modules-right = pulseaudio wlan memory redshift date-spacer

cursor-click = pointer
cursor-scroll = pointer

enable-ipc = true


;==========================================================
; ARCH LINUX
;==========================================================

[module/arch]

type = custom/text

format = %{O14}%{O16}

format-font = 2
format-foreground = ${colors.blue}
format-background = ${colors.background}

click-left = rofi -show drun -theme ~/.config/rofi/theme.rasi


;==========================================================
; WORKSPACES
;==========================================================

[module/xworkspaces]

type = internal/xworkspaces

format = <label-state>

index-sort = true
wrapping-scroll = false

;----------------------------------------------------------
; CURRENT WORKSPACE
;----------------------------------------------------------

label-active = %name%
label-active-background = ${colors.background}
label-active-foreground = ${colors.blue}
label-active-underline = ${colors.workspace-underline}
label-active-padding = 1

;----------------------------------------------------------
; OCCUPIED WORKSPACE
;----------------------------------------------------------

label-occupied = %name%
label-occupied-background = ${colors.background}
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

;----------------------------------------------------------
; VISIBLE WORKSPACE
;----------------------------------------------------------

label-visible = %name%
label-visible-background = ${colors.background}
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

;----------------------------------------------------------
; URGENT WORKSPACE
;----------------------------------------------------------

label-urgent = %name%
label-urgent-background = ${colors.background}
label-urgent-foreground = ${colors.red}
label-urgent-underline = ${colors.red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.foreground-dim}
label-empty-padding = 1


;==========================================================
; SYSTEM TRAY
;==========================================================

[module/tray]

type = internal/tray

format = <tray>

tray-spacing = 5px
tray-size = 16px

tray-background = ${colors.background}
tray-foreground = ${colors.foreground}


;==========================================================
; WINDOW TITLE
;==========================================================

[module/xwindow]

type = internal/xwindow

format = <label>

format-background = ${colors.background}
format-padding = 1

label = %title%
label-foreground = ${colors.foreground}
label-maxlen = 50

label-empty = Desktop
label-empty-foreground = ${colors.foreground-dim}


;==========================================================
; VOLUME
;==========================================================

[module/pulseaudio]

type = internal/pulseaudio

use-ui-max = false

format-volume = <ramp-volume><label-volume>
format-volume-background = ${colors.background}
format-volume-padding = 0

format-muted = <label-muted>
format-muted-background = ${colors.background}
format-muted-padding = 1

label-volume = %percentage%%
label-volume-foreground = ${colors.orange}
label-volume-padding = 1

label-muted =    %percentage%%
label-muted-foreground = ${colors.foreground-dim}
label-muted-padding = 0

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.orange}

click-left = pavucontrol
click-right = pavucontrol

scroll-up = #pulseaudio.inc
scroll-down = #pulseaudio.dec

;==========================================================
; WIFI
;==========================================================

[module/wlan]

type = custom/script
exec = ~/.config/polybar/wifi-status.sh
interval = 2
format = <label>
format-background = ${colors.background}
format-padding = 1
label-foreground = ${colors.green}
click-right = nm-connection-editor


;==========================================================
; MEMORY
;==========================================================

[module/memory]

type = internal/memory

interval = 3

format = <label>

format-background = ${colors.background}
format-padding = 1

label =  RAM %percentage_used%%
label-foreground = ${colors.purple}


;==========================================================
; REDSHIFT / NIGHT
;==========================================================

[module/redshift]

type = custom/text

format = 󱩌 NIGHT

format-foreground = ${colors.foreground}
format-background = ${colors.background}
format-padding = 1

click-left = redshift -O 4000
click-right = redshift -x
click-middle = redshift -O 3500


;==========================================================
; DATE / TIME
;==========================================================

[module/date]

type = internal/date

interval = 1

date = %a %b %d
time = %H:%M:%S

format = <label>

label = %date% %time%
label-foreground = ${colors.foreground}
label-padding = 1


; Резервирует место под отдельную капсулу даты в основной панели.
[module/date-spacer]

type = custom/text
label = "                       "


[bar/datepill]

monitor = HDMI-A-0
monitor-strict = true
width = 220
height = 24
offset-x = 86.5%
offset-y = 8
bottom = false
fixed-center = false

override-redirect = true
wm-restack = i3
enable-struts = false
enable-ipc = true

radius = 8
background = ${colors.date-background}
foreground = ${colors.foreground}

padding-left = 0
padding-right = 0
border-size = 0
module-margin-left = 0
module-margin-right = 0

font-0 = "AdwaitaMono Nerd Font:style=Bold:size=12;3"
font-1 = "AdwaitaMono Nerd Font:size=15;2"
font-2 = "Symbols Nerd Font Mono:size=16;2"

modules-center = date
modules-left =
modules-right =


;==========================================================
; END
;==========================================================
