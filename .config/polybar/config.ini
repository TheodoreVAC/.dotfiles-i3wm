;==========================================================
;              POLYBAR — DARK FLOATING STYLE
;==========================================================

[colors]

background     = #1A202B
background-alt = #111720

foreground          = #D8DEE9
foreground-white    = #FFFFFF
foreground-dim      = #6F7785

blue                = #89B4FA
green               = #8FB0A6
yellow              = #B9B096
purple              = #9E9BC4
orange              = #C2A67C
pink                = #AF93A8
red                 = #C4727E

workspace-underline = #89B4FA

alert               = #C4727E
disabled            = #454A54


;==========================================================
; SETTINGS
;==========================================================

[settings]

screenchange-reload = true
pseudo-transparency = false


;==========================================================
; BAR
;==========================================================

[bar/example]

;==========================================================
; MONITOR
;==========================================================

monitor = HDMI-A-0
monitor-strict = true

;==========================================================
; POSITION
;==========================================================

width = 97%
height = 32

offset-x = 1.5%
offset-y = 4

bottom = false
fixed-center = true

;==========================================================
; WINDOW MANAGEMENT
;==========================================================

override-redirect = true
wm-restack = i3
enable-struts = true

;==========================================================
; APPEARANCE
;==========================================================

radius = 5

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 0
padding-right = 0

border-size = 0
border-color = ${colors.background}

module-margin-left = 0
module-margin-right = 0

separator =

line-size = 3pt


;==========================================================
; FONTS
;==========================================================

font-0 = "AdwaitaMono Nerd Font:style=Bold:size=12;3"
font-1 = "AdwaitaMono Nerd Font:size=15;2"
font-2 = "Symbols Nerd Font Mono:size=16;2"
font-3 = "Symbols Nerd Font Mono:size=12;2"


;==========================================================
; MODULES
;==========================================================

modules-left = arch xworkspaces tray xwindow
modules-center = i3-mode
modules-right = pulseaudio wlan memory redshift xkeyboard notif date

cursor-click = pointer
cursor-scroll = pointer

enable-ipc = true


;==========================================================
; ARCH LINUX
;==========================================================

[module/arch]

type = custom/text

format = %{O14}%{O16}

format-font = 2
format-foreground = ${colors.blue}
format-background = ${colors.background}

click-left = rofi -show drun


;==========================================================
; WORKSPACES
;==========================================================

[module/xworkspaces]

type = internal/xworkspaces

format = <label-state>

icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;6
icon-6 = 7;7
icon-7 = 8;8
icon-8 = 9;9
icon-9 = 10;10

index-sort = true
wrapping-scroll = false

;----------------------------------------------------------
; CURRENT WORKSPACE
;----------------------------------------------------------

label-active = %icon%
label-active-foreground = ${colors.workspace-underline}
label-active-background = ${colors.background}
label-active-underline = ${colors.workspace-underline}
label-active-padding = 1

;----------------------------------------------------------
; OCCUPIED WORKSPACE
;----------------------------------------------------------

label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.background}
label-occupied-padding = 1

;----------------------------------------------------------
; VISIBLE WORKSPACE
;----------------------------------------------------------

label-visible = %icon%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background}
label-visible-padding = 1

;----------------------------------------------------------
; URGENT WORKSPACE
;----------------------------------------------------------

label-urgent = %icon%
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.background}
label-urgent-underline = ${colors.red}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.foreground-dim}
label-empty-padding = 1


;==========================================================
; SYSTEM TRAY
;==========================================================

[module/tray]

type = internal/tray

format = <tray>

tray-spacing = 5px
tray-size = 16px

tray-background = ${colors.background}
tray-foreground = ${colors.foreground}


;==========================================================
; WINDOW TITLE
;==========================================================

[module/xwindow]

type = internal/xwindow

format = <label>

format-background = ${colors.background}
format-padding = 1

label = %title%
label-foreground = ${colors.foreground}
label-maxlen = 50

label-empty = Desktop
label-empty-foreground = ${colors.foreground-dim}

;==========================================================
; I3 BINDING MODE
;==========================================================

[module/i3-mode]

type = custom/script
exec = ~/.config/polybar/i3-mode.sh
interval = 1

format = <label>
label = %output%
label-foreground = ${colors.blue}


;==========================================================
; VOLUME
;==========================================================

[module/pulseaudio]

type = internal/pulseaudio

use-ui-max = false

format-volume = <ramp-volume><label-volume>
format-volume-background = ${colors.background}
format-volume-padding = 0

format-muted = <label-muted>
format-muted-background = ${colors.background}
format-muted-padding = 1

label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}
label-volume-padding = 1

label-muted =    %percentage%%
label-muted-foreground = ${colors.foreground-dim}
label-muted-padding = 0

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.foreground}

click-left = pavucontrol
click-right = pavucontrol

scroll-up = #pulseaudio.inc
scroll-down = #pulseaudio.dec

;==========================================================
; WIFI
;==========================================================

[module/wlan]

type = custom/script
exec = ~/.config/polybar/wifi-status.sh
interval = 2
format = <label>
format-background = ${colors.background}
format-padding = 1
label-foreground = ${colors.foreground}
click-right = nm-connection-editor


;==========================================================
; MEMORY
;==========================================================

[module/memory]

type = internal/memory

interval = 3

format = <label>

format-background = ${colors.background}
format-padding = 1

label =  RAM %percentage_used%%
label-foreground = ${colors.foreground}


;==========================================================
; REDSHIFT / NIGHT
;==========================================================

[module/redshift]

type = custom/text

format = 󱩌 NIGHT

format-foreground = ${colors.foreground}
format-background = ${colors.background}
format-padding = 1

click-left = redshift -O 4000
click-right = redshift -x
click-middle = redshift -O 3500


;==========================================================
; KEYBOARD LAYOUT
;==========================================================

[module/xkeyboard]

type = internal/xkeyboard

format = <label-layout>
format-background = ${colors.background}
format-padding = 1

label-layout = %icon%
label-layout-foreground = ${colors.blue}

layout-icon-0 = us;EN
layout-icon-1 = ru;RU

;==========================================================
; NOTIFICATIONS / DND
;==========================================================

[module/notif]

type = custom/script

exec = ~/.config/dunst/status.sh
interval = 2

format = <label>
format-background = ${colors.background}
format-padding = 1

label = %output%
label-foreground = ${colors.foreground}

click-left = ~/.config/dunst/toggle-dnd.sh
click-right = ~/.config/dunst/history.sh
click-middle = dunstctl history-clear


;==========================================================
; DATE / TIME
;==========================================================

[module/date]

type = internal/date

interval = 1

date = %a %b %d
time = %H:%M:%S

format = <label>

label = %date% %time%
label-foreground = ${colors.foreground}
label-padding = 1

;==========================================================
; END
;==========================================================
