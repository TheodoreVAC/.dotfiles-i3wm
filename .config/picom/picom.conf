backend = "glx";

corner-radius = 8;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.4;

active-opacity = 1.0;
inactive-opacity = 0.96;
inactive-dim = 0.25;

opacity-rule = [
    "100:class_g = 'dmenu'"
];

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];