backend = "glx";

corner-radius = 12;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.4;

# ==========================================================
# WINDOW RULES (picom v13)
#
# Старые опции (active/inactive-opacity, inactive-dim,
# opacity-rule, rounded-corners-exclude) picom игнорирует
# при наличии rules и пишет предупреждения — здесь они
# описаны через rules.
# ==========================================================

# ==========================================================
# АНИМАЦИИ (picom v13)
#
# open  — окно «всплывает»: затухание + лёгкий зум из 90%,
#         быстрый старт и плавная посадка (ease-out expo).
# hide  — i3 унмапит окно при закрытии и при смене
#         воркспейса: окно сжимается и гаснет
#         (ease-in quart), быстрее, чем появляется.
# close — добивает анимацию, если окно уничтожают сразу
#         (скрипт одинаковый с hide, прерывает его).
# size  — плавный ресайз плитки: содержимое растягивается
#         от старых размеров к новым, включая расширение
#         соседних окон, когда i3 открывает новое.
#
# Всплывающие окна (override_redirect: контекстные меню,
# rofi, dunst, тултипы) получают свой короткий набор через
# rules — без заметного зума, только быстрое проявление
# и затухание.
# ==========================================================

animations = (
    {
        triggers = [ "open" ];
        opacity = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.25;
            start = "window-raw-opacity-before";
            end = "window-raw-opacity";
        };
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0.16, 1, 0.3, 1)";
            duration = 0.25;
            start = 0.9;
            end = 1;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    {
        triggers = [ "close", "hide" ];
        opacity = {
            curve = "cubic-bezier(0.7, 0, 0.84, 0)";
            duration = 0.16;
            start = "window-raw-opacity-before";
            end = "window-raw-opacity";
        };
        shadow-opacity = "opacity";
        scale-x = {
            curve = "cubic-bezier(0.7, 0, 0.84, 0)";
            duration = 0.16;
            start = 1;
            end = 0.93;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
    {
        triggers = [ "size" ];
        scale-x = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.2;
            start = "window-width-before / window-width";
            end = 1;
        };
        scale-y = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.2;
            start = "window-height-before / window-height";
            end = 1;
        };
        offset-x = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.2;
            start = "window-x-before - window-x";
            end = 0;
        };
        offset-y = {
            curve = "cubic-bezier(0.22, 1, 0.36, 1)";
            duration = 0.2;
            start = "window-y-before - window-y";
            end = 0;
        };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },
);

rules = (
    # Бар и рабочий стол без скругления picom (у бара свой radius),
    # и классическое поведение: на fullscreen скругления нет.
    {
        match = "window_type = 'dock' || window_type = 'desktop'";
        corner-radius = 0;
    },
    {
        match = "fullscreen";
        corner-radius = 0;
    },
    {
        match = "override_redirect";
        animations = (
            {
                triggers = [ "open" ];
                opacity = {
                    curve = "cubic-bezier(0.16, 1, 0.3, 1)";
                    duration = 0.12;
                    start = "window-raw-opacity-before";
                    end = "window-raw-opacity";
                };
                shadow-opacity = "opacity";
                scale-x = {
                    curve = "cubic-bezier(0.16, 1, 0.3, 1)";
                    duration = 0.12;
                    start = 0.95;
                    end = 1;
                };
                scale-y = "scale-x";
                offset-x = "(1 - scale-x) / 2 * window-width";
                offset-y = "(1 - scale-y) / 2 * window-height";
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-offset-x = "offset-x";
                shadow-offset-y = "offset-y";
            },
            {
                triggers = [ "close", "hide" ];
                opacity = {
                    curve = "cubic-bezier(0.7, 0, 0.84, 0)";
                    duration = 0.1;
                    start = "window-raw-opacity-before";
                    end = "window-raw-opacity";
                };
                shadow-opacity = "opacity";
                scale-x = {
                    curve = "cubic-bezier(0.7, 0, 0.84, 0)";
                    duration = 0.1;
                    start = 1;
                    end = 0.97;
                };
                scale-y = "scale-x";
                offset-x = "(1 - scale-x) / 2 * window-width";
                offset-y = "(1 - scale-y) / 2 * window-height";
                shadow-scale-x = "scale-x";
                shadow-scale-y = "scale-y";
                shadow-offset-x = "offset-x";
                shadow-offset-y = "offset-y";
            },
        );
    },
);
